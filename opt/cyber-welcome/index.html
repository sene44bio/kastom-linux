<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>CYBER_HUD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  body {
    background: #030611;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Фоновые неоновые пятна */
  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    opacity: 0.3;
  }
  .orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, #00f0ff 0%, transparent 70%);
    top: 5%; left: 10%;
  }
  .orb-2 {
    width: 480px; height: 480px;
    background: radial-gradient(circle, #a855f7 0%, transparent 70%);
    bottom: 5%; right: 15%;
  }

  .layout-container {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 80px;
    width: 90%;
    max-width: 1200px;
  }

  /* Левая колонка — Аватар */
  .avatar-pane {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar-img {
    height: 480px;
    width: auto;
    image-rendering: pixelated;
    mix-blend-mode: screen;
    /* Четкий RGB-контур без постоянных перерисовок */
    filter: 
      drop-shadow(-3px -2px 0 #00f0ff) 
      drop-shadow(3px 2px 0 #ff007f) 
      drop-shadow(0 0 18px rgba(0, 240, 255, 0.45));
  }

  /* Правая колонка — Часы и вход */
  .info-pane {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .clock-box {
    margin-bottom: 25px;
  }
  .time-text {
    font-size: 110px;
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 0.9;
    background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 35px rgba(0, 240, 255, 0.25));
  }
  .date-text {
    margin-top: 12px;
    font-size: 15px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #38bdf8;
    font-weight: 600;
    opacity: 0.9;
  }

  /* Стеклянная карточка входа */
  .glass-card {
    background: rgba(10, 16, 32, 0.7);
    border: 1px solid rgba(56, 189, 248, 0.3);
    box-shadow: 
      0 20px 50px rgba(0, 0, 0, 0.7),
      0 0 40px rgba(56, 189, 248, 0.1);
    border-radius: 20px;
    padding: 30px 45px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 18px;
    min-width: 420px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(56, 189, 248, 0.08);
    border: 1px solid rgba(56, 189, 248, 0.25);
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #38bdf8;
    text-transform: uppercase;
  }
  .status-dot {
    width: 6px; height: 6px;
    background: #00f0ff;
    border-radius: 50%;
    box-shadow: 0 0 8px #00f0ff;
  }

  .user-greet {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffffff;
  }
  .user-name {
    background: linear-gradient(135deg, #00f0ff, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5));
  }

  .btn-enter {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(168, 85, 247, 0.15));
    border: 1px solid rgba(0, 240, 255, 0.5);
    color: #ffffff;
    padding: 14px 45px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    border-radius: 12px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s ease;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
  }
  .btn-enter:hover {
    background: linear-gradient(135deg, #00f0ff, #a855f7);
    color: #030611;
    border-color: transparent;
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.8);
    transform: translateY(-2px);
  }
</style>
</head>
<body>

  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="layout-container">
    <div class="avatar-pane">
      <img src="avatar.png" class="avatar-img" alt="SENE44">
    </div>

    <div class="info-pane">
      <div class="clock-box">
        <div class="time-text" id="time">00:00</div>
        <div class="date-text" id="date">Загрузка...</div>
      </div>

      <div class="glass-card">
        <div class="status-badge">
          <div class="status-dot"></div>
          СИСТЕМА ГОТОВА
        </div>
        <div class="user-greet">С возвращением, <span class="user-name">SENE44</span></div>
        <button class="btn-enter" onclick="document.title='EXIT'">Войти</button>
      </div>
    </div>
  </div>

<script>
  function updateTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('time').textContent = `${h}:${m}`;

    const days = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
    const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    document.getElementById('date').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
  }
  setInterval(updateTime, 1000);
  updateTime();

  window.onkeydown = function(e) {
    if (e.key === "Enter" || e.key === " " || e.key === "Escape") {
      document.title = "EXIT";
    }
  };
</script>
</body>
</html>
